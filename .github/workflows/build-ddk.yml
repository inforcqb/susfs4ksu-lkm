name: build-lkm-ddk

on:
  # Every push to main (and any other buildable branch) builds all six variants in privileged
  # containers; the legacy branch has no DDK image for its pre-5.10 range and must not be built
  # at all.  A documentation-only push has nothing to compile.  (Same trigger the legacy branch
  # carries; kept in sync deliberately.)
  push:
    branches-ignore:
      - legacy
    paths-ignore:
      - "**.md"
  workflow_dispatch:

jobs:
  # One .ko per GKI (kernel version × Android release) combination that exists.  A module is NOT portable across these
  # (vermagic/KMI differ, and so do the LSM hook prototypes this module hooks by offset), so every combination the DDK
  # publishes gets its own build and its own artifact.
  #   5.10 → android12-5.10, android13-5.10   6.1  → android14-6.1 (kCFI starts here)
  #   5.15 → android13-5.15, android14-5.15   6.6  → android15-6.6
  # There is no android14-6.6: Android 14 is 5.15/6.1 and Android 15 is 6.6.  The image tag is pinned to a date on
  # purpose, so the same commit rebuilt later produces the same module.
  #
  # 6.12 (Android 16) and 6.18 (Android 17) are NOT built here and must not be added: they are where LSM dispatch became
  # one static call per (hook, LSM slot) and security_hook_list lost its hlist node, which is a different mechanism with
  # its own code path.  That work lives on the `dev` preview branch (android16-6.12, android17-6.18); `main` is the
  # stable line and ships exactly these six variants.
  module:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
    container:
      # DDK-min image with the GKI kernel headers (modules_prepare done), Module.symvers and the matching Clang toolchain:
      # KMI freezing guarantees symbol CRCs match the GKI kernel of that release.
      image: ghcr.io/ylarod/ddk-min:${{ matrix.variant }}-20260828
      options: --privileged

    steps:
      - name: Inspect DDK environment
        run: |
          set -e
          echo "variant  = ${{ matrix.variant }}"
          echo "KDIR=$KDIR"
          echo "KERNEL_SRC=$KERNEL_SRC"
          echo "CLANG_PATH=$CLANG_PATH"
          clang --version | head -1
          # `make -C "$KDIR"` below needs the OBJTREE (a prepared output tree with its Makefile and generated headers); the
          # sources live in a separate tree (KERNEL_SRC, where include/linux/lsm_hooks.h actually is).  Checking for the
          # header HERE was the first version of this guard and it failed all six variants at once.
          if [ -z "$KDIR" ] || [ ! -f "$KDIR/Makefile" ]; then
            echo "::error::KDIR ('$KDIR') is not a prepared kernel build tree (no Makefile) for variant ${{ matrix.variant }}"
            exit 1
          fi
          for d in "${KERNEL_SRC:-}" "${KDIR:-}" "/opt/ddk/src/${{ matrix.variant }}" /opt/ddk/src/*; do
            if [ -n "$d" ] && [ -f "$d/include/linux/lsm_hooks.h" ]; then
              echo "source tree = $d"
              break
            fi
          done

      - name: Checkout module
        uses: actions/checkout@v4

      # kCFI/CFI checks the callee's type at every indirect call site and the LSM dispatch calls our replacements
      # indirectly, so a replacement MUST match the hook type EXACTLY and must not be __nocfi.  Printing this tree's
      # authoritative declarations is how a hook that changed or disappeared between releases is caught, per variant.
      - name: Show authoritative LSM hook signatures
        run: |
          set -e
          V="${{ matrix.variant }}"
          H=""
          for d in "${KERNEL_SRC:-}" "${KDIR:-}" "/opt/ddk/src/$V" "/opt/ddk/kdir/$V" /opt/ddk/src/* /opt/ddk/kdir/*; do
            if [ -n "$d" ] && [ -f "$d/include/linux/lsm_hooks.h" ]; then H="$d"; break; fi
          done
          if [ -z "$H" ]; then
            echo "::error::no kernel tree with include/linux/lsm_hooks.h found (variant=$V KERNEL_SRC=$KERNEL_SRC KDIR=$KDIR)"
            exit 1
          fi
          echo "=== kernel tree: $H ==="
          DEFS="$H/include/linux/lsm_hook_defs.h"
          [ -f "$DEFS" ] || DEFS="$H/include/linux/lsm_hooks.h"
          echo "=== hook declarations: $DEFS ==="

          # Exactly the hooks this module installs (kernel/sus_path.c).  A missing one is a hard error: the module would
          # not compile against this tree, and a silently dropped hook would read as coverage in the counters.
          HOOKS="inode_permission inode_getattr inode_unlink inode_rmdir inode_rename \
                 inode_link sb_statfs inode_setattr inode_getxattr inode_listxattr \
                 inode_setxattr inode_removexattr path_notify"
          n=0
          for h in $HOOKS; do
            out=$(grep -nE "(^|[^_a-z])${h}," "$DEFS" | head -2 || true)
            if [ -z "$out" ]; then
              echo "::error::hook '$h' is not declared in $DEFS (variant $V)"
              exit 1
            fi
            echo "--- $h ---"; echo "$out"; n=$((n+1))
          done
          echo "checked $n hook prototypes"

          echo "=== the SELinux implementations we target by name ==="
          for s in inode_permission inode_getattr inode_unlink inode_rmdir inode_rename \
                   inode_link sb_statfs inode_setattr inode_getxattr inode_listxattr \
                   inode_setxattr inode_removexattr path_notify; do
            echo "--- selinux_$s ---"
            grep -nA3 "^static int selinux_$s(" "$H/security/selinux/hooks.c" | head -5 || true
          done

          echo "=== the hook list head type (static calls start at 6.12, which this branch does not build) ==="
          grep -nE 'struct security_hook_heads security_hook_heads|struct lsm_static_calls_table' "$H/security/security.c" | head -3 || true
          echo "=== struct security_hook_list fields (the lsm field changed over releases) ==="
          sed -n '/^struct security_hook_list {/,/} __randomize_layout/p' "$H/include/linux/lsm_hooks.h"

      - name: Show per-version spellings of the non-LSM APIs the module uses
        run: |
          set -e
          V="${{ matrix.variant }}"
          T=""
          for d in "${KERNEL_SRC:-}" "${KDIR:-}" "/opt/ddk/src/$V" "/opt/ddk/kdir/$V" /opt/ddk/src/* /opt/ddk/kdir/*; do
            if [ -n "$d" ] && [ -f "$d/include/linux/lsm_hooks.h" ]; then T="$d"; break; fi
          done
          echo "=== kernel tree: $T ==="
          echo "--- the version this build's LINUX_VERSION_CODE gates are evaluated against ---"
          # The kdir (objtree) holds the generated headers the src tree may lack: version.h is what LINUX_VERSION_CODE
          # expands from, utsrelease.h is the human-readable release.
          G="${KDIR:-$T}/include/generated"
          cat "$G/uapi/linux/version.h" 2>/dev/null || true
          cat "$G/utsrelease.h" 2>/dev/null || cat "$T/include/generated/utsrelease.h" 2>/dev/null || true
          echo "--- inode timestamps (i_ctime became __i_ctime + inode_get_ctime() in 6.6) ---"
          grep -nE 'i_atime;|i_mtime;|_i_ctime;|inode_get_ctime|inode_set_ctime' "$T/include/linux/fs.h" | head -8 || true
          echo "--- the mm's vma container (mm->mmap list before 6.1, mm->mm_mt from 6.1) ---"
          grep -nE 'struct vm_area_struct \*mmap;|struct maple_tree mm_mt;' "$T/include/linux/mm_types.h" || true
          grep -nE '^#define VMA_ITERATOR|^#define for_each_vma' "$T/include/linux/mm_types.h" "$T/include/linux/mm.h" || true
          echo "--- kallsyms_on_each_symbol (its callback lost the struct module * in 6.5) ---"
          grep -nA3 'kallsyms_on_each_symbol' "$T/include/linux/kallsyms.h" | head -12 || true
          echo "--- task_work_add notify modes ---"
          grep -nE 'TWA_RESUME|task_work_add' "$T/include/linux/task_work.h" || true
          echo "--- kvmalloc()/kvfree() ---"
          grep -nE 'void \*kvmalloc\(|void kvfree\(' "$T/include/linux/mm.h" "$T/include/linux/slab.h" || true

          echo "--- CFI scheme, RANDSTRUCT and the LSM set as THIS tree was configured ---"
          # Read from the tree's own generated config, not assumed: the option that selects CFI has more than one
          # spelling upstream (CONFIG_CFI_CLANG, and CONFIG_CFI in newer trees), __randomize_layout is only a no-op while
          # RANDSTRUCT is off, and MAX_LSM_COUNT follows from the SECURITY_* set.  A missing entry prints "(absent here)",
          # so a gate that did not apply stays visible instead of reading as an answer.
          A="$G/autoconf.h"
          cfg() {
            _v=""
            if [ -f "$A" ]; then
              _v=$(grep -hE "^(#define $1 |/\* #undef $1 \*/)" "$A" | head -1)
            fi
            if [ -z "$_v" ] && [ -f "$KDIR/.config" ]; then
              _v=$(grep -hE "^(# )?$1[= ]" "$KDIR/.config" | head -1)
            fi
            echo "${_v:-(absent here)}"
          }
          for k in CONFIG_SECURITY CONFIG_CFI_CLANG CONFIG_CFI CONFIG_RANDSTRUCT \
                   CONFIG_GCC_PLUGIN_RANDSTRUCT CONFIG_ARM64_BTI_KERNEL CONFIG_LTO_CLANG \
                   CONFIG_LTO_CLANG_FULL CONFIG_KALLSYMS_ALL CONFIG_MODULES \
                   CONFIG_HAVE_STATIC_CALL CONFIG_HAVE_STATIC_CALL_INLINE \
                   CONFIG_SECURITY_SELINUX CONFIG_SECURITY_SAFESETID CONFIG_SECURITY_LANDLOCK \
                   CONFIG_BPF_LSM CONFIG_ARM64_VA_BITS_48; do
            printf '  %-30s %s\n' "$k" "$(cfg "$k")"
          done

      - name: Build susfs_guard_lkm.ko (DDK way)
        run: |
          set -e
          # One line on purpose: trailing backslashes followed by a blank line ended the shell continuation, so this used to
          # run `make -C $KDIR M=.../kernel` with no ARCH/CC/LLVM and no `modules` target, silently depending on the image's
          # exported ARCH/LLVM.  -k (keep going) so one broken object does not hide every later one; it still exits nonzero.
          make -k -C "$KDIR" M="$PWD/kernel" ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 modules -j"$(nproc)"
          ls -la kernel/susfs_guard_lkm.ko
          file kernel/susfs_guard_lkm.ko

      - name: Verify sections (__versions / .BTF / cfi)
        run: |
          set -e
          f=kernel/susfs_guard_lkm.ko
          readelf -S "$f" | grep -E "__versions|\.BTF|cfi|\.llvm_addrsig|\.plt|modinfo" || true
          echo "--- vermagic ---"
          modinfo "$f" 2>/dev/null | grep -E "vermagic|srcversion" || true
          echo "--- CFI scheme of this tree ---"
          # 5.10/5.15 use LLVM CFI (__cfi_check + shadow + .cfi_jt); 6.1/6.6 use kCFI (a type hash right before the
          # function, checked inline by the caller).  The module's symbol resolution differs between the two, so record which.
          grep -cE '\.cfi_jt$' /proc/kallsyms 2>/dev/null | sed 's/^/  .cfi_jt symbols in the build container: /' || true
          echo "--- mount-hook symbols this module probes by name ---"
          for s in show_vfsstat show_mountinfo show_vfsmnt; do
            printf '  %-16s %s\n' "$s" "$(grep -cE " $s\$" /proc/kallsyms 2>/dev/null || echo '?')"
          done
          echo "--- KMI version-check state ---"
          # modpost emits CRCs (and srcversion, module_layout) only when Module.symvers carries them, and this DDK tree's
          # __versions is empty - so check_version() finds no entry for ANY imported symbol and load-time version checking
          # does not happen: "it loads" is not evidence that the KMI matches.  Warns rather than fails for exactly that reason.
          vs=$(readelf -SW "$f" | awk '/\] __versions/ {print $6}')
          sv=$(readelf -p .modinfo "$f" | grep -c 'srcversion=' || true)
          ml=$(nm -u "$f" | grep -c 'module_layout' || true)
          echo "__versions size=${vs:-?} srcversion=${sv} module_layout=${ml}"
          if [ "${vs:-0}" = "0" ] || [ "${sv:-0}" = "0" ] || [ "${ml:-0}" = "0" ]; then
            echo "::warning::no symbol CRCs in this build tree: load-time version checks are inert (Module.symvers has no CRC entries)"
          fi

          echo "--- symbol namespace imports ---"
          # kern_path / ihold / override_creds / revert_creds are EXPORT_SYMBOL_NS(.., ANDROID_GKI_VFS_EXPORT_ONLY), which
          # each tree's Makefile rewrites to the long namespace string; a module that does not import the RESULTING string is
          # refused by the loader ("Unknown symbol kern_path (err -22)"), i.e. a missing import_ns is load-fatal while an
          # imported-but-unused namespace is harmless - asserted on the artifact because it is invisible in the source.
          readelf -p .modinfo "$f" 2>/dev/null | grep 'import_ns' || {
            echo "::error::no import_ns entry in $f - kern_path/ihold/override_creds/revert_creds will be refused with -EINVAL on the variants that namespace them (see MODULE_IMPORT_NS in kernel/susfs_main.c)"
            exit 1
          }

          echo "--- no kallsyms_* link-time dependency (regression gate) ---"
          # These five are resolved at RUNTIME by name (kprobe bootstrap, kernel/symbol_resolver.c) and must never appear in
          # the artifact's undefined list: measured on a 6.1 device whose KernelSU is a module, all five are provided by
          # kernelsu.ko, so an import would make this module refuse to load without KernelSU.  Asserted on the ARTIFACT.
          nm -u "$f" | wc -l | sed 's/^/  undefined symbols total: /'
          ks=$(nm -u "$f" | grep -cE '(^| )(kallsyms_lookup_name|kallsyms_lookup|kallsyms_lookup_size_offset|kallsyms_on_each_symbol|kallsyms_on_each_match_symbol)$' || true)
          echo "  undefined kallsyms-ish symbols: $ks (must be 0)"
          if [ "$ks" != "0" ]; then
            echo "::error::$f imports $ks kallsyms_* symbol(s): they must be bootstrapped at runtime, not linked against"
            nm -u "$f" | grep -E '(^| )(kallsyms_lookup_name|kallsyms_lookup|kallsyms_lookup_size_offset|kallsyms_on_each_symbol|kallsyms_on_each_match_symbol)$' || true
            exit 1
          fi

      # A checked indirect call into the KERNEL is a panic, not an error return: the compiler
      # instruments the call site, the kernel compares the callee's type id against the one
      # the caller expected, and for this module the two do not agree - measured on a 5.15
      # device, where the first call through a runtime-resolved pointer died with
      # "Kernel panic - not syncing: CFI failure (target: kallsyms_on_each_symbol+0x0/0x1e4)".
      # Every call through a resolved pointer therefore has to sit inside a __nocfi function.
      #
      # Source review cannot assert that: LTO re-instruments a `static __nocfi` helper that
      # was inlined into a caller without the attribute, which is exactly how that panic
      # ended up inside susfs_sus_mount_supercall().  So the assertion is made on the
      # ARTIFACT, by tools/cfi_sites.py - a relocation against the CFI runtime entry point
      # (5.10/5.15: LLVM CFI with .cfi_jt) and, from 6.1 on, the KCFI check sequence itself
      # (`ldur Wt, [Xn, #-4]` of the callee's type id plus cmp plus the `brk` trap), because
      # KCFI's mismatch path is a trap and relocates nothing.
      - name: CFI call-site gate (an instrumented indirect call must stay module-local)
        run: |
          set -e
          f=kernel/susfs_guard_lkm.ko
          # Allow-list: calls through MODULE-local function tables only.  There the compiler
          # emitted both the call site and the callee, so the type ids agree by construction:
          #   init_module / susfs_layers_down - the susfs_layers[] init/exit table
          #   susfs_tw_func                   - the supercall command table
          # (The CFI runtime's own __cfi_check is filtered by the tool, not listed here.)
          ALLOW="init_module,susfs_layers_down,susfs_tw_func"
          if command -v python3 >/dev/null 2>&1; then PY=python3
          elif command -v python >/dev/null 2>&1; then PY=python
          else
            echo "::error::no python interpreter in this image, so the CFI call-site gate cannot run - failing rather than skipping, because a silently skipped check is how the panic above reached a release"
            exit 1
          fi
          "$PY" tools/cfi_sites.py --allow "$ALLOW" "$f"

      # The dirent layer probes a syscall entry point BY NAME (kernel/sus_path.c:
      # sus_dirent_candidates[]), and which of those names survives is a property of the
      # BUILD, not of the source: __arm64_sys_* is referenced by the syscall table and so
      # always exists, while __do_*/__se_* are `static inline`/`static` with a single caller
      # and can be inlined away (measured on a 6.1 device: __do_sys_getdents64 and
      # __do_compat_sys_getdents were both gone, kallsyms_lookup_name() found neither, and
      # the listing filter was never armed there).
      #
      # The module now tries the wrapper first, so what has to hold at runtime is that the
      # WRAPPER exists.  If this variant's DDK tree ships a built image or a symbol map, that
      # is checkable here, before anyone loads anything.  If it ships neither - which is the
      # case for a headers-only DDK image - this step cannot say anything at all and says so
      # out loud, instead of passing silently as if it had verified something.
      - name: Check the getdents probe symbols in the DDK tree (best effort)
        run: |
          set -e
          V="${{ matrix.variant }}"
          S=""
          for d in "${KDIR:-}" "${KERNEL_SRC:-}" "/opt/ddk/kdir/$V" "/opt/ddk/src/$V" /opt/ddk/kdir/* /opt/ddk/src/*; do
            if [ -n "$d" ] && { [ -f "$d/vmlinux" ] || [ -f "$d/System.map" ]; }; then S="$d"; break; fi
          done
          if [ -z "$S" ]; then
            echo "no vmlinux/System.map in the DDK image: the getdents symbol check AND the undefined-symbol loader gate are both SKIPPED for $V - that is a gap in this variant's evidence, not a pass"
            exit 0
          fi
          echo "=== symbol source: $S ==="
          ls -la "$S/vmlinux" "$S/System.map" 2>/dev/null || true

          # System.map first (it is names only and cheap); vmlinux via nm, then via
          # readelf -sW for an image nm cannot read.  Returns the match count on stdout.
          sym_count() {
            _s="$1"; _n=0
            if [ -f "$S/System.map" ]; then
              _n=$(grep -cE "(^|[[:space:]])${_s}$" "$S/System.map" 2>/dev/null || true)
            fi
            if [ "${_n:-0}" = "0" ] && [ -f "$S/vmlinux" ]; then
              _n=$(nm "$S/vmlinux" 2>/dev/null | grep -cE "(^|[[:space:]])${_s}$" || true)
            fi
            if [ "${_n:-0}" = "0" ] && [ -f "$S/vmlinux" ]; then
              _n=$(readelf -sW "$S/vmlinux" 2>/dev/null | grep -cE "[[:space:]]${_s}$" || true)
            fi
            echo "${_n:-0}"
          }

          # Informational: the whole candidate list, so a variant's log shows which of the
          # three fallbacks would have been available as well.
          echo "--- candidates from kernel/sus_path.c (informational) ---"
          for s in __arm64_sys_getdents64 __do_sys_getdents64 __se_sys_getdents64 \
                   __arm64_compat_sys_getdents __do_compat_sys_getdents __se_compat_sys_getdents; do
            printf '  %-32s %s\n' "$s" "$(sym_count "$s")"
          done

          # Hard error: the two names the module arms FIRST and therefore depends on at
          # runtime.  Without them the dirent layer is dead on this variant and a hidden
          # entry shows up in every listing.
          echo "--- asserted ---"
          fail=0
          for s in __arm64_sys_getdents64 __arm64_compat_sys_getdents; do
            n=$(sym_count "$s")
            printf '  %-32s %s\n' "$s" "$n"
            if [ "$n" = "0" ]; then
              echo "::error::$s is not in $S (variant $V) - this is the getdents wrapper the LKM arms first (kernel/sus_path.c: sus_dirent_candidates[]); without it the dirent filter cannot arm on this variant"
              fail=1
            fi
          done
          [ "$fail" = "0" ] || exit 1
          echo "both getdents wrapper symbols present in $S"

          # ---- loader gate: every undefined symbol of the built .ko must be a name this
          # tree's kallsyms has.
          #
          # The loaders (tools/susfs_insmod.c and ksud insmod) rewrite each SHN_UNDEF entry
          # of the image to SHN_ABS/<address from /proc/kallsyms> before init_module(2), so a
          # name that is not in kallsyms is an address nothing can supply: for a strong
          # symbol the module does not load on that kernel at all, and for a weak one the
          # feature it feeds silently does nothing.  System.map is generated from the same
          # kallsyms data the loader reads, so this is the build-time half of "the loader
          # will find it at load time".
          echo "--- every undefined symbol of the .ko must be present in this tree ---"
          KO="$PWD/kernel/susfs_guard_lkm.ko"
          if [ ! -f "$KO" ]; then
            echo "::error::$KO does not exist - the build step must have failed, so its undefined symbols cannot be checked"
            exit 1
          fi
          nm "$KO" | awk '$1 == "U" || $1 == "w" || $1 == "v" { print $NF }' | sort -u > /tmp/undef-syms.txt
          tu=$(wc -l < /tmp/undef-syms.txt)
          echo "  undefined symbols in the artifact: $tu"
          echo "  names: $(tr '\n' ' ' < /tmp/undef-syms.txt)"
          miss=0
          while read -r s; do
            [ -n "$s" ] || continue
            n=$(sym_count "$s")
            if [ "$n" = "0" ]; then
              echo "::error::'$s' is undefined in the module but not present in $S (variant $V) - no loader can supply its address on this kernel"
              miss=$((miss + 1))
            fi
          done < /tmp/undef-syms.txt
          if [ "$miss" != "0" ]; then
            echo "::error::$miss undefined symbol(s) of the module are missing from $S (variant $V)"
            exit 1
          fi
          echo "  all $tu undefined symbols are present in $S"

      # The module resolves a SECOND class of symbols BY NAME at runtime
      # (kernel/symbol_resolver.c: find_kernel_symbol_exact + the kprobe bootstrap).  Those never
      # appear in the .ko's undefined list, so the loader gate above cannot see them - and a name
      # that moved, was renamed, or was inlined away in ONE tree silently disables that feature on
      # that variant only.  Measured on android14-6.1: `__do_sys_getdents64` and
      # `__do_compat_sys_getdents` are gone there while the wrappers stay, which is exactly why the
      # dirent layer probes the wrapper first.  This step prints the DDK tree's own answer for every
      # by-name lookup the module makes, per variant.  The three show_* callbacks are a hard error
      # (without them /proc/mounts and /proc/self/mountinfo are not filtered at all, i.e. the mount
      # layer is off on that variant); everything else is reported, because the module degrades
      # feature-by-feature there.  The >= 6.12 lookups (static_calls_table, lsm_active_cnt,
      # mnt_id_xa) are not listed: this branch has no 6.12/6.18 job and that code is never built
      # here.
      - name: Check the symbols the module resolves by name (DDK tree)
        run: |
          set -e
          V="${{ matrix.variant }}"
          S=""
          for d in "${KDIR:-}" "${KERNEL_SRC:-}" "/opt/ddk/kdir/$V" "/opt/ddk/src/$V" /opt/ddk/kdir/* /opt/ddk/src/*; do
            if [ -n "$d" ] && { [ -f "$d/vmlinux" ] || [ -f "$d/System.map" ]; }; then S="$d"; break; fi
          done
          if [ -z "$S" ]; then
            echo "::warning::no vmlinux/System.map for $V - the by-name symbol check is SKIPPED for this variant (a gap in its evidence, not a pass)"
            exit 0
          fi
          sym_count() {
            _s="$1"; _n=0
            if [ -f "$S/System.map" ]; then
              _n=$(grep -cE "(^|[[:space:]])${_s}$" "$S/System.map" 2>/dev/null || true)
            fi
            if [ "${_n:-0}" = "0" ] && [ -f "$S/vmlinux" ]; then
              _n=$(nm "$S/vmlinux" 2>/dev/null | grep -cE "(^|[[:space:]])${_s}$" || true)
            fi
            if [ "${_n:-0}" = "0" ] && [ -f "$S/vmlinux" ]; then
              _n=$(readelf -sW "$S/vmlinux" 2>/dev/null | grep -cE "[[:space:]]${_s}$" || true)
            fi
            echo "${_n:-0}"
          }
          echo "=== by-name lookups (kernel/symbol_resolver.c, find_kernel_symbol_exact) in $S ==="
          # --- hard: the mount layer's three show callbacks (/proc/mounts, mountinfo, mountstats)
          hardmiss=0
          for s in show_vfsmnt show_mountinfo show_vfsstat; do
            n=$(sym_count "$s"); printf '  %-34s %s\n' "$s" "$n"
            if [ "$n" = "0" ]; then
              echo "::error::$s is not in $S (variant $V): the mount layer hooks it by name per mount line; without it /proc/mounts / mountinfo are not filtered on this kernel"
              hardmiss=$((hardmiss + 1))
            fi
          done
          # --- reported: everything else the module resolves by name.  A 0 means the feature that
          #     needs it degrades on this variant (the module logs which one at load).
          for s in copy_mnt_ns attach_recursive_mnt generic_shutdown_super seq_show \
                   __arm64_sys_statx do_statx put_mnt_ns d_path security_cred_getsecid \
                   mnt_id_ida ida_alloc_range ida_free namespace_sem \
                   kallsyms_op kallsyms_lookup_name kallsyms_lookup kallsyms_on_each_symbol \
                   kallsyms_on_each_match_symbol synchronize_rcu_tasks task_work_add \
                   saved_boot_config init_mm copy_to_kernel_nofault __set_fixmap \
                   security_hook_heads set_memory_ro set_memory_rw set_memory_x \
                   aarch64_insn_patch_text text_poke module_alloc \
                   smaps_walk_ops smaps_shmem_walk_ops pagemap_ops \
                   dcache_clean_inval_poc caches_clean_inval_pou __flush_dcache_area \
                   __arm64_sys_getdents64 __arm64_compat_sys_getdents \
                   __do_sys_getdents64 __do_compat_sys_getdents; do
            n=$(sym_count "$s"); printf '  %-34s %s\n' "$s" "$n"
            if [ "$n" = "0" ]; then
              echo "::warning::$s is not in $S (variant $V) - the feature that resolves it by name cannot arm on this kernel"
            fi
            # More than one match is a hazard in itself, not just for the callers that use
            # .symbol_name: print the neighbours of each match so the log says WHO else is
            # called that (measured: `seq_show` is four symbols from 6.1 on, one on 5.10/5.15).
            if [ "$n" -gt 1 ] && [ -f "$S/System.map" ]; then
              grep -nE "(^|[[:space:]])${s}$" "$S/System.map" | cut -d: -f1 | while read -r _l; do
                echo "      match at System.map:$_l and its neighbours:"
                sed -n "$(( _l > 1 ? _l - 1 : 1 )),$(( _l + 1 ))p" "$S/System.map" | sed 's/^/        /'
              done
            fi
          done
          [ "$hardmiss" = "0" ] || exit 1
          echo "the three mount show callbacks are present in $S"

      - name: Upload .ko
        uses: actions/upload-artifact@v4
        with:
          name: susfs_guard_lkm.ko-${{ matrix.variant }}
          path: kernel/susfs_guard_lkm.ko
          if-no-files-found: error

  # The userspace tools are freestanding and kernel-independent, so they are built once rather than six times.  A broken
  # tool FAILS this job on purpose: it is the evidence-gathering half of this project, and a tool that cannot compile or
  # that reads the ABI wrong is how "verified" becomes wrong.
  tools:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:android14-6.1-20260828
      options: --privileged
    steps:
      - name: Checkout module
        uses: actions/checkout@v4

      # Not part of the module: a freestanding aarch64 client for the supercall commands ksu_susfs does not expose
      # (hide_sus_mnts_for_non_su_procs, add_sus_path_loop).
      - name: Build userspace supercall client
        run: |
          set -e
          clang --target=aarch64-linux-gnu -O2 -nostdlib -static-pie \
                -fno-stack-protector -fno-builtin -fuse-ld=lld -Wl,-e,_start \
                -o /tmp/susfs_sc tools/susfs_sc.c
          file /tmp/susfs_sc
          ls -la /tmp/susfs_sc

      - name: Upload userspace client
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: susfs_sc
          path: /tmp/susfs_sc
          if-no-files-found: warn

      # Micro-benchmark for the syscall layers (same freestanding shape as the client above), used to answer
      # "what does the hook cost per call".
      - name: Build syscall micro-benchmark
        run: |
          clang --target=aarch64-linux-gnu -O2 -nostdlib -static-pie \
                -fno-stack-protector -fno-builtin -fuse-ld=lld -Wl,-e,_start \
                -o /tmp/susfs_bench tools/susfs_bench.c
          file /tmp/susfs_bench
          ls -la /tmp/susfs_bench

      - name: Upload micro-benchmark
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: susfs_bench
          path: /tmp/susfs_bench
          if-no-files-found: warn

      # mmap a file, touch it, then read /proc/self/pagemap and /proc/self/smaps_rollup *in the same process* - a shell
      # cannot do this, because the child that runs dd has its own mm and therefore its own addresses.
      - name: Build mmap/pagemap probe
        run: |
          clang --target=aarch64-linux-gnu -O2 -nostdlib -static-pie \
                -fno-stack-protector -fno-builtin -fuse-ld=lld -Wl,-e,_start \
                -o /tmp/susfs_mmap tools/susfs_mmap.c
          file /tmp/susfs_mmap
          ls -la /tmp/susfs_mmap

      - name: Upload mmap/pagemap probe
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: susfs_mmap
          path: /tmp/susfs_mmap
          if-no-files-found: warn

      # The second door to a hidden mapping's content: /proc/self/mem and process_vm_readv(2), both read by the process
      # that owns the mapping - the only way to tell whether a remote-memory hook actually refuses.
      - name: Build remote-memory probe
        run: |
          clang --target=aarch64-linux-gnu -O2 -nostdlib -static-pie \
                -fno-stack-protector -fno-builtin -fuse-ld=lld -Wl,-e,_start \
                -o /tmp/susfs_memrd tools/susfs_memrd.c
          file /tmp/susfs_memrd
          ls -la /tmp/susfs_memrd

      - name: Upload remote-memory probe
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: susfs_memrd
          path: /tmp/susfs_memrd
          if-no-files-found: warn

      # The detector's view of a hidden mount: the mnt_id that /proc/self/fdinfo/N prints and statx(2) returns, checked
      # against the ids mountinfo lists.
      - name: Build mnt_id cross-check
        run: |
          clang --target=aarch64-linux-gnu -O2 -nostdlib -static-pie \
                -fno-stack-protector -fno-builtin -fuse-ld=lld -Wl,-e,_start \
                -o /tmp/susfs_mntid tools/susfs_mntid.c
          file /tmp/susfs_mntid
          ls -la /tmp/susfs_mntid

      - name: Upload mnt_id cross-check
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: susfs_mntid
          path: /tmp/susfs_mntid
          if-no-files-found: warn

      # A 32-bit client.  Only a real AArch32 caller can exercise the compat stat path, and the audit showed the module
      # had the compat structure wrong - no 64-bit test could have seen that.
      - name: Build 32-bit compat stat client
        run: |
          set -e
          clang --target=armv7a-linux-androideabi -march=armv7-a -O2 -nostdlib \
                -static-pie -fno-stack-protector -fno-builtin -fuse-ld=lld \
                -Wl,-e,_start -o /tmp/susfs_compat_stat tools/susfs_compat_stat.c
          file /tmp/susfs_compat_stat
          ls -la /tmp/susfs_compat_stat

      - name: Upload 32-bit compat stat client
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: susfs_compat_stat
          path: /tmp/susfs_compat_stat
          if-no-files-found: warn

      # The loading half of this project: it loads the .ko on a stock vendor kernel WITHOUT ksud, by rewriting every
      # undefined symbol of the image to st_shndx=SHN_ABS / st_value=<kallsyms address> before init_module(2), so the
      # kernel's SHN_UNDEF branch (resolve_symbol -> export lookup, namespace import, CRC check, KMI whitelist) is never
      # entered at all.  See the source header.
      - name: Build module loader (no-ksud insmod)
        run: |
          set -e
          clang --target=aarch64-linux-gnu -O2 -nostdlib -static-pie \
                -fno-stack-protector -fno-builtin -fuse-ld=lld -Wl,-e,_start \
                -o /tmp/susfs_insmod tools/susfs_insmod.c
          file /tmp/susfs_insmod
          ls -la /tmp/susfs_insmod

      - name: Upload module loader
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: susfs_insmod
          path: /tmp/susfs_insmod
          if-no-files-found: warn
